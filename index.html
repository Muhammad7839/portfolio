<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muhammad Imran | Portfolio</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <noscript><link rel="stylesheet" href="assets/css/noscript.css"></noscript>
  <style>
    :root {
      --primary: #00d2ff;
      --secondary: #3a47d5;
      --bg-dark: #0f0f0f;
      --text-light: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      transition: all 0.4s ease;
    }

    /* Splash */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #000000, #0f0f0f);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: fadeIn 1.5s ease-in-out forwards;
      opacity: 1;
    }

    /* Fade-out effect */
    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.9s ease;
    }

    .popup-content {
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 4rem 3rem;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
      animation: pulseBox 2.5s infinite;
    }

    .popup-content h1 {
      font-size: 2.5rem;
      margin-bottom: 2rem;
      font-weight: 800;
      color: #e0e0e0;
      text-shadow: 0 0 10px #00d2ff;
      letter-spacing: 1.2px;
    }

    .hidden { display: none; }

    /* Sidebar */
    #sidebar {
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      width: 220px;
      background: #1e1e1e;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 1000;
    }

    #sidebar .logo {
      display: none;
    }

    #sidebar ul {
      list-style: none;
      padding: 0;
      width: 100%;
    }

    #sidebar ul li {
      margin: 1rem 0;
    }

    #sidebar ul li a {
      color: white;
      text-decoration: none;
      font-size: 1rem;
      transition: 0.2s;
    }

    #sidebar ul li a:hover {
      color: #1e90ff;
    }

    .hero-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1200px;
      height: 90vh;
      margin-left: 240px;
      padding: 2rem;
    }

    .hero-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
      animation: fadeInLeft 1.5s ease-out;
    }

    .hero-left h2 {
      font-size: 1rem;
      color: #bbb;
      letter-spacing: 1px;
    }

    #typing-name {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(to right, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
      border-right: 3px solid var(--primary);
      overflow: hidden;
      min-height: 1.2em;
    }

    .hero-left p {
      font-size: 1.2rem;
      max-width: 90%;
      color: #ccc;
    }

    .hero-right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-right img {
      width: 80%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }

    @keyframes pulseBox {
      0% { box-shadow: 0 0 30px rgba(0, 210, 255, 0.3); }
      50% { box-shadow: 0 0 45px rgba(0, 210, 255, 0.6); }
      100% { box-shadow: 0 0 30px rgba(0, 210, 255, 0.3); }
    }

    @keyframes fadeInLeft {
      from { opacity: 0; transform: translateX(-40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media(max-width: 768px) {
      .hero-container {
        flex-direction: column;
        height: auto;
        padding: 2rem 1rem;
        margin-left: 0;
      }

      .hero-right img {
        width: 85%;
      }

      #sidebar {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div id="splash">
    <div class="popup-content">
      <h1>Building Real Software, Beyond Just Projects</h1>
    </div>
  </div>

  <aside id="sidebar">
    <ul>
      <li><a href="about.html">About</a></li>
      <li><a href="experience.html">Experience</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="skills.html">Skills</a></li>
      <li><a href="education.html">Education</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="resume.html">Resume</a></li>
    </ul>
  </aside>

  <div class="hero-container hidden" id="hero-section">
    <div class="hero-left">
      <h2>Focused on building things that matter</h2>
      <h1 id="typing-name"></h1>
      <p>Clarity. Structure. Purpose.</p>
    </div>
    <div class="hero-right">
      <img src="images/recent.jpeg" alt="Muhammad Imran">
    </div>
  </div>

  <script>
    window.addEventListener("load", () => {
      setTimeout(() => {
        const splash = document.getElementById('splash');
        if (!splash || splash.style.display === 'none') return;

        splash.classList.add('fade-out');
        setTimeout(() => enterSite(), 900);
      }, 1300);
    });

    function enterSite() {
      const splash = document.getElementById('splash');
      const hero = document.getElementById('hero-section');

      if (splash) splash.style.display = 'none';
      if (hero) {
        hero.classList.remove('hidden');
        hero.style.display = 'flex';
      }

      startTyping();
    }

    function startTyping() {
      const text = "Muhammad Imran";
      const target = document.getElementById("typing-name");
      let i = 0;

      if (!target) return;
      target.textContent = "";

      function typeLetter() {
        if (i < text.length) {
          target.textContent += text.charAt(i);
          i++;
          setTimeout(typeLetter, 150);
        }
      }

      typeLetter();
    }
  </script>
</body>
</html>
